{% extends "base.html" %}
{% block title %}Đăng nhập - Voltix Admin{% endblock %}
{% block public %}
<div class="min-vh-100 d-flex align-items-center justify-content-center p-3" style="background:#0f1b2d">
  <div class="card p-4" style="width:100%;max-width:380px">
    <div class="text-center mb-3">
      <i class="bi bi-lightning-charge-fill text-primary fs-1"></i>
      <h4 class="mb-0">Voltix Admin</h4>
      <small class="text-muted">Power Your Next Level.</small>
    </div>
    {% for category, message in messages %}<div class="alert alert-{{ category }} py-2">{{ message }}</div>{% endfor %}
    <form method="post" action="/admin/login">
      <div class="mb-3"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required autofocus></div>
      <div class="mb-3"><label class="form-label">Mật khẩu</label><input name="password" type="password" class="form-control" required></div>
      <button class="btn btn-primary w-100">Đăng nhập</button>
    </form>
  </div>
</div>
{% endblock %}
